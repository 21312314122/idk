<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fast Web Proxy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          #1d4ed8 0%,
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          #7c3aed 0%,
          transparent 35%
        ),
        #020617;

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    .card {
      background: rgba(15, 23, 42, 0.84);

      border: 1px solid rgba(255, 255, 255, 0.1);

      backdrop-filter: blur(20px);

      border-radius: 24px;

      padding: 42px;

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding: 8px 12px;

      border-radius: 999px;

      background: rgba(59, 130, 246, 0.15);

      border: 1px solid rgba(96, 165, 250, 0.2);

      color: #93c5fd;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 18px;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #4ade80;

      box-shadow:
        0 0 12px rgba(74, 222, 128, 0.8);
    }

    h1 {
      margin: 0;

      font-size: clamp(42px, 8vw, 72px);

      line-height: 0.95;

      letter-spacing: -3px;
    }

    .gradient {
      background:
        linear-gradient(
          90deg,
          #60a5fa,
          #a78bfa,
          #f472b6
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .subtitle {
      margin: 20px 0 30px;

      color: #94a3b8;

      font-size: 17px;

      line-height: 1.6;
    }

    .search {
      display: flex;

      gap: 10px;

      padding: 8px;

      background: #0f172a;

      border: 1px solid #334155;

      border-radius: 16px;
    }

    .search input {
      flex: 1;

      min-width: 0;

      border: none;

      outline: none;

      background: transparent;

      color: white;

      font-size: 17px;

      padding: 16px;
    }

    .search input::placeholder {
      color: #64748b;
    }

    .search button {
      border: none;

      border-radius: 12px;

      padding: 0 24px;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

      color: white;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .search button:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .search button:active {
      transform: translateY(0);
    }

    .examples {
      margin-top: 22px;

      display: flex;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;

      color: #64748b;

      font-size: 14px;
    }

    .example {
      border: 1px solid #334155;

      background: #111827;

      color: #cbd5e1;

      padding: 8px 11px;

      border-radius: 10px;

      cursor: pointer;

      transition: 0.15s ease;
    }

    .example:hover {
      border-color: #60a5fa;
      color: white;
    }

    .status {
      display: none;

      margin-top: 20px;

      padding: 13px 15px;

      border-radius: 12px;

      font-size: 14px;
    }

    .loading {
      background: rgba(37, 99, 235, 0.12);

      border: 1px solid rgba(96, 165, 250, 0.18);

      color: #93c5fd;
    }

    .error {
      background: rgba(127, 29, 29, 0.25);

      border: 1px solid rgba(248, 113, 113, 0.2);

      color: #fca5a5;
    }

    .info {
      margin-top: 30px;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 12px;
    }

    .info-box {
      padding: 17px;

      border-radius: 14px;

      background: rgba(30, 41, 59, 0.55);

      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .info-title {
      font-size: 12px;

      color: #64748b;

      text-transform: uppercase;

      letter-spacing: 1px;

      margin-bottom: 7px;
    }

    .info-value {
      font-weight: 700;

      color: #e2e8f0;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #475569;

      font-size: 13px;
    }

    @media (max-width: 700px) {
      .card {
        padding: 28px;
      }

      .search {
        flex-direction: column;
      }

      .search button {
        height: 52px;
      }

      .info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="badge">
        <span class="dot"></span>
        Fast Proxy Online
      </div>

      <h1>
        Browse <span class="gradient">Faster.</span>
      </h1>

      <p class="subtitle">
        Enter a website address and load it through your
        proxy server.
      </p>

      <form id="proxyForm" class="search">

        <input
          id="urlInput"
          type="text"
          placeholder="https://example.com"
          autocomplete="off"
          spellcheck="false"
          required
        >

        <button type="submit">
          Go →
        </button>

      </form>

      <div class="examples">
        <span>Try:</span>

        <button
          class="example"
          type="button"
          data-url="https://example.com"
        >
          Example
        </button>

        <button
          class="example"
          type="button"
          data-url="https://www.wikipedia.org"
        >
          Wikipedia
        </button>

        <button
          class="example"
          type="button"
          data-url="https://www.poki.com"
        >
          Poki
        </button>
      </div>

      <div
        id="loading"
        class="status loading"
      >
        Loading website through proxy...
      </div>

      <div
        id="error"
        class="status error"
      ></div>

      <div class="info">

        <div class="info-box">
          <div class="info-title">
            Connection
          </div>

          <div class="info-value">
            Render Backend
          </div>
        </div>

        <div class="info-box">
          <div class="info-title">
            Resources
          </div>

          <div class="info-value">
            Direct CDN Loading
          </div>
        </div>

        <div class="info-box">
          <div class="info-title">
            Cache
          </div>

          <div class="info-value">
            Enabled
          </div>
        </div>

      </div>

    </section>

    <div class="footer">
      Fast Web Proxy
    </div>

  </main>

  <script>

    /*
     * IMPORTANT:
     *
     * This is your Render backend.
     */
    const PROXY_SERVER =
      "https://idk-3-89oq.onrender.com";


    const form =
      document.getElementById("proxyForm");

    const input =
      document.getElementById("urlInput");

    const loading =
      document.getElementById("loading");

    const error =
      document.getElementById("error");


    function showLoading() {

      loading.style.display = "block";

      error.style.display = "none";

    }


    function showError(message) {

      error.textContent = message;

      error.style.display = "block";

      loading.style.display = "none";

    }


    form.addEventListener(
      "submit",
      event => {

        event.preventDefault();

        let value =
          input.value.trim();


        if (!value) {
          return;
        }


        /*
         * Add HTTPS when the user
         * enters example.com instead
         * of https://example.com
         */
        if (
          !/^https?:\/\//i.test(value)
        ) {

          value =
            "https://" + value;

        }


        try {

          const target =
            new URL(value);


          if (
            target.protocol !== "http:" &&
            target.protocol !== "https:"
          ) {

            showError(
              "Please enter an HTTP or HTTPS website."
            );

            return;

          }


          showLoading();


          /*
           * Send the request to Render.
           *
           * This is the important part
           * that connects your GitHub Pages
           * frontend to the Node server.
           */
          const destination =
            PROXY_SERVER +
            "/proxy?url=" +
            encodeURIComponent(
              target.href
            );


          window.location.href =
            destination;

        } catch {

          showError(
            "Please enter a valid website URL."
          );

        }

      }
    );


    /*
     * Example buttons.
     */
    document
      .querySelectorAll(".example")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            input.value =
              button.dataset.url;

            form.requestSubmit();

          }
        );

      });

  </script>

</body>
</html>
