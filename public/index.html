<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>FastProxy</title>

<style>

:root {
  --bg:#070b14;
  --panel:#111827;
  --panel2:#182235;
  --border:rgba(255,255,255,.08);
  --text:#f8fafc;
  --muted:#94a3b8;
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --green:#22c55e;
}

body.light {
  --bg:#eef2f7;
  --panel:#ffffff;
  --panel2:#f3f6fa;
  --border:rgba(15,23,42,.09);
  --text:#0f172a;
  --muted:#64748b;
}

* {
  box-sizing:border-box;
}

html,
body {
  width:100%;
  height:100%;
  margin:0;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

body {
  overflow:hidden;
}

button,
input {
  font:inherit;
}

button {
  border:0;
}

.browser {
  height:100vh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(99,102,241,.2),
      transparent 27%
    ),
    radial-gradient(
      circle at 90% 100%,
      rgba(139,92,246,.16),
      transparent 30%
    ),
    var(--bg);
}

/* HEADER */

.header {
  height:62px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  background:rgba(17,24,39,.82);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

body.light .header {
  background:rgba(255,255,255,.82);
}

.logo {
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  box-shadow:
    0 10px 30px
    rgba(99,102,241,.3);
  font-size:19px;
}

.brand {
  font-weight:900;
  font-size:17px;
}

.brand span {
  color:#8b5cf6;
}

.online {
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--muted);
}

.online-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:
    0 0 12px
    rgba(34,197,94,.6);
}

.space {
  flex:1;
}

.server-button {
  height:38px;
  padding:0 13px;
  display:flex;
  align-items:center;
  gap:8px;
  border-radius:11px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  cursor:pointer;
  font-size:12px;
}

.server-button:hover {
  border-color:var(--accent);
}

.theme {
  width:38px;
  height:38px;
  border-radius:11px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  cursor:pointer;
}

/* TABS */

.tabs {
  min-height:42px;
  display:flex;
  align-items:end;
  gap:5px;
  padding:0 9px;
  background:rgba(17,24,39,.82);
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  scrollbar-width:none;
}

body.light .tabs {
  background:rgba(255,255,255,.82);
}

.tabs::-webkit-scrollbar {
  display:none;
}

.tab {
  height:37px;
  min-width:145px;
  max-width:230px;
  padding:0 10px;
  display:flex;
  align-items:center;
  gap:7px;
  border-radius:10px 10px 0 0;
  color:var(--muted);
  background:var(--panel2);
  cursor:pointer;
  border:1px solid transparent;
}

.tab.active {
  background:var(--bg);
  color:var(--text);
  border-color:var(--border);
}

.tab-title {
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:13px;
}

.close {
  width:22px;
  height:22px;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}

.close:hover {
  background:rgba(148,163,184,.12);
  color:var(--text);
}

.new-tab {
  width:35px;
  height:35px;
  margin-bottom:1px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:22px;
}

/* NAVIGATION */

.nav {
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  background:rgba(17,24,39,.82);
  border-bottom:1px solid var(--border);
}

body.light .nav {
  background:rgba(255,255,255,.82);
}

.nav-btn {
  width:38px;
  height:38px;
  border-radius:10px;
  background:var(--panel2);
  color:var(--text);
  cursor:pointer;
  border:1px solid var(--border);
  font-size:17px;
}

.nav-btn:disabled {
  opacity:.3;
  cursor:default;
}

.address-wrap {
  flex:1;
  position:relative;
}

.address {
  width:100%;
  height:40px;
  padding:0 65px 0 42px;
  border-radius:20px;
  border:1px solid var(--border);
  outline:none;
  color:var(--text);
  background:rgba(2,6,23,.35);
}

body.light .address {
  background:#f8fafc;
}

.address:focus {
  border-color:var(--accent);
  box-shadow:
    0 0 0 3px
    rgba(99,102,241,.12);
}

.lock {
  position:absolute;
  left:15px;
  top:11px;
  opacity:.7;
}

.go {
  position:absolute;
  right:5px;
  top:5px;
  height:30px;
  padding:0 12px;
  border-radius:15px;
  color:white;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

/* INFO */

.info {
  height:30px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 14px;
  color:var(--muted);
  font-size:11px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
  overflow-x:auto;
}

.info strong {
  color:var(--text);
}

.good {
  color:var(--green);
}

/* CONTENT */

.content {
  position:relative;
  flex:1;
  min-height:0;
}

.page {
  position:absolute;
  inset:0;
  display:none;
}

.page.active {
  display:block;
}

iframe {
  width:100%;
  height:100%;
  border:0;
  background:white;
}

/* HOME */

.home {
  height:100%;
  overflow:auto;
  display:flex;
  justify-content:center;
  padding:65px 20px;
}

.home-inner {
  width:min(1050px,100%);
  text-align:center;
}

.hero-icon {
  width:84px;
  height:84px;
  margin:0 auto 20px;
  display:grid;
  place-items:center;
  border-radius:25px;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  box-shadow:
    0 20px 60px
    rgba(99,102,241,.3);
  font-size:36px;
}

.hero {
  margin:0;
  font-size:clamp(42px,7vw,74px);
  letter-spacing:-4px;
  line-height:.95;
}

.hero span {
  background:
    linear-gradient(
      90deg,
      #60a5fa,
      #8b5cf6,
      #ec4899
    );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitle {
  max-width:650px;
  margin:18px auto 30px;
  color:var(--muted);
  line-height:1.65;
}

.home-search {
  width:min(800px,100%);
  margin:auto;
  display:flex;
  gap:8px;
  padding:7px;
  border-radius:18px;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:
    0 25px 80px
    rgba(0,0,0,.25);
}

.home-search input {
  flex:1;
  min-width:0;
  padding:15px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
}

.home-search button {
  padding:0 25px;
  border-radius:13px;
  color:white;
  font-weight:800;
  cursor:pointer;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

.section {
  margin-top:38px;
  margin-bottom:14px;
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
}

.cards {
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:12px;
}

.card {
  text-align:left;
  padding:18px;
  border-radius:17px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  cursor:pointer;
  transition:
    transform .18s ease,
    border-color .18s ease;
}

.card:hover {
  transform:translateY(-3px);
  border-color:var(--accent);
}

.card-icon {
  font-size:25px;
  margin-bottom:10px;
}

.card-name {
  font-size:14px;
  font-weight:850;
}

.card-url {
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

/* LOADING */

.loading {
  position:absolute;
  inset:0;
  z-index:1000;
  display:none;
  place-items:center;
  background:
    rgba(2,6,23,.93);
  backdrop-filter:blur(15px);
}

.loading.show {
  display:grid;
}

.loading-box {
  width:min(430px,88%);
  padding:30px;
  text-align:center;
  border-radius:21px;
  background:#111827;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    0 30px 100px
    rgba(0,0,0,.45);
}

.spinner {
  width:58px;
  height:58px;
  margin:0 auto 18px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.08);
  border-top-color:#8b5cf6;
  animation:
    spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform:rotate(360deg);
  }
}

.loading-title {
  font-size:21px;
  font-weight:900;
}

.loading-url {
  margin-top:8px;
  color:#94a3b8;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.progress {
  height:5px;
  margin-top:22px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
}

.progress-bar {
  width:35%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      #60a5fa,
      #8b5cf6,
      #ec4899
    );
  animation:
    move 1.3s ease-in-out infinite;
}

@keyframes move {
  from {
    transform:translateX(-140%);
  }

  to {
    transform:translateX(380%);
  }
}

/* SERVER MENU */

.server-menu {
  position:fixed;
  top:58px;
  right:14px;
  width:300px;
  padding:12px;
  display:none;
  z-index:3000;
  border-radius:17px;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:
    0 30px 100px
    rgba(0,0,0,.35);
}

.server-menu.show {
  display:block;
}

.server-title {
  padding:4px 6px 10px;
  font-size:14px;
  font-weight:850;
}

.server {
  width:100%;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  border-radius:11px;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  text-align:left;
}

.server:hover {
  background:var(--panel2);
}

.server-name {
  flex:1;
}

.server-latency {
  color:var(--muted);
  font-size:11px;
}

@media (max-width:750px) {

  .brand,
  .online {
    display:none;
  }

  .cards {
    grid-template-columns:
      repeat(2,1fr);
  }

  .home-search {
    flex-direction:column;
  }

  .home-search button {
    height:50px;
  }

}

</style>

</head>

<body>

<div class="browser">

  <header class="header">

    <div class="logo">
      ⚡
    </div>

    <div class="brand">
      Fast<span>Proxy</span>
    </div>

    <div class="online">
      <span class="online-dot"></span>
      Online
    </div>

    <div class="space"></div>

    <button
      id="serverButton"
      class="server-button"
    >
      🌎
      <span id="serverName">
        US East
      </span>
      ▾
    </button>

    <button
      id="theme"
      class="theme"
    >
      ☀️
    </button>

  </header>


  <div
    id="serverMenu"
    class="server-menu"
  >

    <div class="server-title">
      Proxy servers
    </div>

    <div id="serverList"></div>

  </div>


  <div
    id="tabs"
    class="tabs"
  ></div>


  <div class="nav">

    <button
      id="back"
      class="nav-btn"
    >
      ←
    </button>

    <button
      id="forward"
      class="nav-btn"
    >
      →
    </button>

    <button
      id="reload"
      class="nav-btn"
    >
      ⟳
    </button>

    <button
      id="home"
      class="nav-btn"
    >
      ⌂
    </button>

    <div class="address-wrap">

      <span class="lock">
        🔒
      </span>

      <input
        id="address"
        class="address"
        placeholder="Search or enter website"
        autocomplete="off"
        spellcheck="false"
      >

      <button
        id="go"
        class="go"
      >
        Go
      </button>

    </div>

  </div>


  <div class="info">

    <span>
      ⚡ Speed:
      <strong id="speed">—</strong>
    </span>

    <span>
      🧠 Cache:
      <strong id="cache">
        Ready
      </strong>
    </span>

    <span>
      🌎 Server:
      <strong id="currentServer">
        US East
      </strong>
    </span>

    <span>
      ●
      <strong id="status" class="good">
        Ready
      </strong>
    </span>

  </div>


  <main
    id="content"
    class="content"
  ></main>


  <div
    id="loading"
    class="loading"
  >

    <div class="loading-box">

      <div class="spinner"></div>

      <div class="loading-title">
        Connecting
      </div>

      <div
        id="loadingUrl"
        class="loading-url"
      >
        Finding fastest proxy...
      </div>

      <div class="progress">
        <div class="progress-bar"></div>
      </div>

    </div>

  </div>

</div>


<script>

/* ========================================================
   PROXY SERVERS

   You currently have ONE server.

   Add more Render URLs later here.
======================================================== */

const SERVERS = [
  {
    name: "US East",
    flag: "🇺🇸",
    url: "https://idk-3-89oq.onrender.com"
  }
];


let selectedServer =
  SERVERS[0];

let tabs = [];

let activeTabId =
  null;

let nextTabId = 1;


/* ========================================================
   ELEMENTS
======================================================== */

const tabsEl =
  document.getElementById("tabs");

const contentEl =
  document.getElementById("content");

const addressEl =
  document.getElementById("address");

const loadingEl =
  document.getElementById("loading");

const loadingUrlEl =
  document.getElementById("loadingUrl");

const speedEl =
  document.getElementById("speed");

const cacheEl =
  document.getElementById("cache");

const statusEl =
  document.getElementById("status");

const serverNameEl =
  document.getElementById("serverName");

const currentServerEl =
  document.getElementById("currentServer");

const serverMenuEl =
  document.getElementById("serverMenu");

const serverListEl =
  document.getElementById("serverList");


/* ========================================================
   SERVER UI
======================================================== */

function updateServerUI() {

  serverNameEl.textContent =
    selectedServer.name;

  currentServerEl.textContent =
    selectedServer.name;

}


function renderServers() {

  serverListEl.innerHTML = "";

  SERVERS.forEach(server => {

    const button =
      document.createElement("button");

    button.className =
      "server";

    button.innerHTML = `
      <span>
        ${server.flag}
      </span>

      <span class="server-name">
        ${server.name}
      </span>

      <span class="server-latency">
        Online
      </span>
    `;

    button.onclick = () => {

      selectedServer =
        server;

      updateServerUI();

      serverMenuEl.classList.remove(
        "show"
      );

    };

    serverListEl.appendChild(
      button
    );

  });

}


/* ========================================================
   PROXY URL
======================================================== */

function proxyUrl(url) {

  return (
    selectedServer.url +
    "/proxy?url=" +
    encodeURIComponent(url)
  );

}


/* ========================================================
   HOME
======================================================== */

function getHomeHTML() {

  return `
    <div class="home">

      <div class="home-inner">

        <div class="hero-icon">
          ⚡
        </div>

        <h1 class="hero">
          Fast<span>Proxy</span>
        </h1>

        <p class="subtitle">
          A premium browser-style proxy with
          smart caching, multiple proxy servers,
          tabs and live performance information.
        </p>

        <div class="home-search">

          <input
            class="home-input"
            placeholder="Enter a website..."
            autocomplete="off"
            spellcheck="false"
          >

          <button class="home-go">
            Browse →
          </button>

        </div>

        <div class="section">
          Quick launch
        </div>

        <div class="cards">

          <button
            class="card"
            data-url="https://example.com"
          >
            <div class="card-icon">
              🌐
            </div>

            <div class="card-name">
              Example
            </div>

            <div class="card-url">
              example.com
            </div>
          </button>


          <button
            class="card"
            data-url="https://www.google.com"
          >
            <div class="card-icon">
              🔎
            </div>

            <div class="card-name">
              Google
            </div>

            <div class="card-url">
              google.com
            </div>
          </button>


          <button
            class="card"
            data-url="https://www.wikipedia.org"
          >
            <div class="card-icon">
              📚
            </div>

            <div class="card-name">
              Wikipedia
            </div>

            <div class="card-url">
              wikipedia.org
            </div>
          </button>


          <button
            class="card"
            data-url="https://www.poki.com"
          >
            <div class="card-icon">
              🎮
            </div>

            <div class="card-name">
              Poki
            </div>

            <div class="card-url">
              poki.com
            </div>
          </button>

        </div>

      </div>

    </div>
  `;

}


/* ========================================================
   CREATE TAB
======================================================== */

function createTab() {

  const id =
    nextTabId++;

  const page =
    document.createElement("div");

  page.className =
    "page";

  page.innerHTML =
    getHomeHTML();

  contentEl.appendChild(
    page
  );


  const tab = {

    id,

    title:
      "New Tab",

    url:
      null,

    history:
      [],

    historyIndex:
      -1,

    page,

    iframe:
      null,

    start:
      null

  };


  tabs.push(tab);

  activeTabId =
    id;


  attachHomeEvents(
    page
  );

  renderTabs();

  switchTab(id);

  return tab;

}


/* ========================================================
   GET ACTIVE TAB
======================================================== */

function getActiveTab() {

  return tabs.find(
    tab =>
      tab.id === activeTabId
  );

}


/* ========================================================
   NAVIGATE
======================================================== */

function navigate(rawUrl) {

  let url =
    rawUrl.trim();

  if (!url) {
    return;
  }


  if (
    !/^https?:\/\//i.test(url)
  ) {

    url =
      "https://" + url;

  }


  try {

    url =
      new URL(url).href;

  } catch {

    statusEl.textContent =
      "Invalid URL";

    return;

  }


  const tab =
    getActiveTab();

  if (!tab) {
    return;
  }


  showLoading(url);


  const start =
    performance.now();


  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.src =
    proxyUrl(url);


  iframe.loading =
    "eager";


  iframe.addEventListener(
    "load",
    () => {

      const elapsed =
        performance.now() -
        start;


      speedEl.textContent =
        elapsed < 1000
          ? Math.round(elapsed) + " ms"
          : (elapsed / 1000).toFixed(2) +
            " s";


      loadingEl.classList.remove(
        "show"
      );


      cacheEl.textContent =
        "Active";


      statusEl.textContent =
        "Loaded";

    }
  );


  tab.page.innerHTML =
    "";

  tab.page.appendChild(
    iframe
  );


  tab.iframe =
    iframe;

  tab.url =
    url;

  tab.title =
    getDomain(url);


  tab.history =
    tab.history.slice(
      0,
      tab.historyIndex + 1
    );


  tab.history.push(
    url
  );


  tab.historyIndex =
    tab.history.length - 1;


  renderTabs();

  updateAddress();

  updateNavigation();

}


/* ========================================================
   LOADING
======================================================== */

function showLoading(url) {

  loadingUrlEl.textContent =
    url;

  loadingEl.classList.add(
    "show"
  );

  statusEl.textContent =
    "Loading";

  speedEl.textContent =
    "Loading...";

}


/* ========================================================
   SWITCH TAB
======================================================== */

function switchTab(id) {

  activeTabId =
    id;


  tabs.forEach(tab => {

    tab.page.classList.toggle(
      "active",
      tab.id === id
    );

  });


  renderTabs();

  updateAddress();

  updateNavigation();


  const tab =
    getActiveTab();


  if (tab && tab.url) {

    statusEl.textContent =
      "Ready";

  } else {

    statusEl.textContent =
      "Home";

  }

}


/* ========================================================
   RENDER TABS
======================================================== */

function renderTabs() {

  tabsEl.innerHTML =
    "";


  tabs.forEach(tab => {

    const element =
      document.createElement(
        "div"
      );

    element.className =
      "tab" +
      (
        tab.id === activeTabId
          ? " active"
          : ""
      );


    const title =
      document.createElement(
        "div"
      );

    title.className =
      "tab-title";

    title.textContent =
      tab.title;


    const close =
      document.createElement(
        "button"
      );

    close.className =
      "close";

    close.textContent =
      "×";


    close.onclick = event => {

      event.stopPropagation();

      closeTab(tab.id);

    };


    element.appendChild(
      title
    );

    element.appendChild(
      close
    );


    element.onclick =
      () =>
        switchTab(tab.id);


    tabsEl.appendChild(
      element
    );

  });


  const plus =
    document.createElement(
      "button"
    );

  plus.className =
    "new-tab";

  plus.textContent =
    "+";

  plus.onclick =
    () => createTab();


  tabsEl.appendChild(
    plus
  );

}


/* ========================================================
   CLOSE TAB
======================================================== */

function closeTab(id) {

  const index =
    tabs.findIndex(
      tab =>
        tab.id === id
    );


  if (index === -1) {
    return;
  }


  tabs[index].page.remove();

  tabs.splice(
    index,
    1
  );


  if (!tabs.length) {

    createTab();

    return;

  }


  if (activeTabId === id) {

    const newIndex =
      Math.max(
        0,
        index - 1
      );


    activeTabId =
      tabs[newIndex].id;

  }


  renderTabs();

  switchTab(
    activeTabId
  );

}


/* ========================================================
   ADDRESS
======================================================== */

function updateAddress() {

  const tab =
    getActiveTab();


  addressEl.value =
    tab && tab.url
      ? tab.url
      : "";

}


/* ========================================================
   HISTORY
======================================================== */

function updateNavigation() {

  const tab =
    getActiveTab();


  if (!tab) {
    return;
  }


  document.getElementById(
    "back"
  ).disabled =
    tab.historyIndex <= 0;


  document.getElementById(
    "forward"
  ).disabled =
    tab.historyIndex >=
      tab.history.length - 1;

}


function loadHistory(
  tab,
  url
) {

  showLoading(url);


  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.src =
    proxyUrl(url);


  const start =
    performance.now();


  iframe.addEventListener(
    "load",
    () => {

      const elapsed =
        performance.now() -
        start;


      speedEl.textContent =
        elapsed < 1000
          ? Math.round(elapsed) +
            " ms"
          : (elapsed / 1000).toFixed(2) +
            " s";


      loadingEl.classList.remove(
        "show"
      );

      statusEl.textContent =
        "Loaded";

    }
  );


  tab.page.innerHTML =
    "";

  tab.page.appendChild(
    iframe
  );

  tab.iframe =
    iframe;

  tab.url =
    url;

  tab.title =
    getDomain(url);


  updateAddress();

  updateNavigation();

}


document.getElementById(
  "back"
).onclick = () => {

  const tab =
    getActiveTab();


  if (
    !tab ||
    tab.historyIndex <= 0
  ) {
    return;
  }


  tab.historyIndex--;


  loadHistory(
    tab,
    tab.history[
      tab.historyIndex
    ]
  );

};


document.getElementById(
  "forward"
).onclick = () => {

  const tab =
    getActiveTab();


  if (
    !tab ||
    tab.historyIndex >=
      tab.history.length - 1
  ) {
    return;
  }


  tab.historyIndex++;


  loadHistory(
    tab,
    tab.history[
      tab.historyIndex
    ]
  );

};


/* ========================================================
   HOME / RELOAD
======================================================== */

document.getElementById(
  "home"
).onclick = () => {

  const tab =
    getActiveTab();


  if (!tab) {
    return;
  }


  tab.url =
    null;

  tab.title =
    "New Tab";

  tab.history =
    [];

  tab.historyIndex =
    -1;

  tab.page.innerHTML =
    getHomeHTML();

  tab.iframe =
    null;


  attachHomeEvents(
    tab.page
  );


  renderTabs();

  updateAddress();

  updateNavigation();


  speedEl.textContent =
    "—";

  cacheEl.textContent =
    "Ready";

  statusEl.textContent =
    "Home";

};


document.getElementById(
  "reload"
).onclick = () => {

  const tab =
    getActiveTab();


  if (!tab || !tab.url) {
    return;
  }


  navigate(
    tab.url
  );

};


/* ========================================================
   ADDRESS BAR
======================================================== */

document.getElementById(
  "go"
).onclick = () => {

  navigate(
    addressEl.value
  );

};


addressEl.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      navigate(
        addressEl.value
      );

    }

  }
);


/* ========================================================
   HOME EVENTS
======================================================== */

function attachHomeEvents(
  page
) {

  const input =
    page.querySelector(
      ".home-input"
    );

  const button =
    page.querySelector(
      ".home-go"
    );


  if (input && button) {

    button.onclick =
      () =>
        navigate(
          input.value
        );


    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          navigate(
            input.value
          );

        }

      }
    );

  }


  page
    .querySelectorAll(
      ".card"
    )
    .forEach(card => {

      card.onclick =
        () =>
          navigate(
            card.dataset.url
          );

    });

}


/* ========================================================
   THEME
======================================================== */

const themeButton =
  document.getElementById(
    "theme"
  );


const savedTheme =
  localStorage.getItem(
    "fastproxy-theme"
  );


if (
  savedTheme === "light"
) {

  document.body.classList.add(
    "light"
  );

  themeButton.textContent =
    "🌙";

}


themeButton.onclick =
  () => {

    const light =
      document.body.classList.toggle(
        "light"
      );


    localStorage.setItem(
      "fastproxy-theme",
      light
        ? "light"
        : "dark"
    );


    themeButton.textContent =
      light
        ? "🌙"
        : "☀️";

  };


/* ========================================================
   SERVER MENU
======================================================== */

document.getElementById(
  "serverButton"
).onclick = () => {

  serverMenuEl.classList.toggle(
    "show"
  );

};


function selectFastestServer() {

  if (
    SERVERS.length === 1
  ) {

    selectedServer =
      SERVERS[0];

    updateServerUI();

    renderServers();

    return;

  }


  Promise.all(
    SERVERS.map(
      async server => {

        const start =
          performance.now();

        try {

          await fetch(
            server.url +
            "/health",
            {
              cache:
                "no-store"
            }
          );


          return {
            server,
            latency:
              performance.now() -
              start
          };

        } catch {

          return {
            server,
            latency:
              Infinity
          };

        }

      }
    )
  ).then(results => {

    results.sort(
      (a,b) =>
        a.latency -
        b.latency
    );


    selectedServer =
      results[0].server;


    updateServerUI();


    renderServers();

  });

}


/* ========================================================
   DOMAIN
======================================================== */

function getDomain(url) {

  try {

    return new URL(url)
      .hostname
      .replace(
        /^www\./,
        ""
      );

  } catch {

    return "New Tab";

  }

}


/* ========================================================
   START
======================================================== */

updateServerUI();

renderServers();

selectFastestServer();

createTab();

</script>

</body>

</html>
