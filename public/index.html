<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>FastProxy</title>

<style>

:root {
  --bg:#060a13;
  --panel:#101827;
  --panel2:#172235;
  --border:rgba(255,255,255,.08);
  --text:#f8fafc;
  --muted:#94a3b8;
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --green:#22c55e;
  --red:#ef4444;
}

body.light {
  --bg:#eef2f7;
  --panel:#ffffff;
  --panel2:#f3f6fa;
  --border:rgba(15,23,42,.09);
  --text:#0f172a;
  --muted:#64748b;
}

* {
  box-sizing:border-box;
}

html,
body {
  width:100%;
  height:100%;
  margin:0;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

body {
  overflow:hidden;
}

button,
input {
  font:inherit;
}

button {
  border:0;
}

.browser {
  height:100vh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(99,102,241,.20),
      transparent 28%
    ),
    radial-gradient(
      circle at 95% 100%,
      rgba(139,92,246,.15),
      transparent 30%
    ),
    var(--bg);
}

/* HEADER */

.header {
  height:62px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  background:rgba(16,24,39,.82);
  backdrop-filter:blur(25px);
  border-bottom:1px solid var(--border);
}

body.light .header {
  background:rgba(255,255,255,.82);
}

.logo {
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  box-shadow:
    0 12px 35px
    rgba(99,102,241,.32);
  font-size:20px;
}

.brand {
  font-weight:900;
  font-size:17px;
}

.brand span {
  color:#8b5cf6;
}

.online {
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
}

.online-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:
    0 0 12px
    rgba(34,197,94,.65);
}

.header-space {
  flex:1;
}

/* SERVER */

.server-button {
  height:38px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 13px;
  border-radius:11px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  cursor:pointer;
  font-size:12px;
}

.server-button:hover {
  border-color:var(--accent);
}

.server-menu {
  position:fixed;
  top:58px;
  right:12px;
  width:285px;
  display:none;
  z-index:5000;
  padding:12px;
  border-radius:17px;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:
    0 30px 100px
    rgba(0,0,0,.4);
}

.server-menu.show {
  display:block;
}

.server-heading {
  padding:5px 7px 10px;
  font-size:13px;
  font-weight:800;
}

.server-option {
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border-radius:11px;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  text-align:left;
}

.server-option:hover {
  background:var(--panel2);
}

.server-option-name {
  flex:1;
}

.server-status {
  color:var(--muted);
  font-size:10px;
}

/* THEME */

.theme {
  width:38px;
  height:38px;
  border-radius:11px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  cursor:pointer;
}

/* DEACTIVATION */

.deactivate {
  height:38px;
  padding:0 14px;
  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #ef4444,
      #b91c1c
    );

  color:white;

  border:1px solid
    rgba(255,255,255,.12);

  cursor:pointer;

  font-size:11px;
  font-weight:900;
  letter-spacing:.4px;

  box-shadow:
    0 8px 25px
    rgba(239,68,68,.18);

  transition:
    transform .15s ease,
    filter .15s ease;
}

.deactivate:hover {
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.deactivate:active {
  transform:translateY(0);
}

/* TABS */

.tabs {
  min-height:42px;
  display:flex;
  align-items:end;
  gap:5px;
  padding:0 9px;
  overflow-x:auto;
  scrollbar-width:none;
  background:rgba(16,24,39,.82);
  border-bottom:1px solid var(--border);
}

body.light .tabs {
  background:rgba(255,255,255,.82);
}

.tabs::-webkit-scrollbar {
  display:none;
}

.tab {
  height:37px;
  min-width:145px;
  max-width:230px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 10px;
  border-radius:10px 10px 0 0;
  background:var(--panel2);
  color:var(--muted);
  cursor:pointer;
  border:1px solid transparent;
  border-bottom:0;
}

.tab.active {
  background:var(--bg);
  color:var(--text);
  border-color:var(--border);
}

.tab-title {
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:13px;
}

.tab-close {
  width:22px;
  height:22px;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}

.tab-close:hover {
  background:rgba(148,163,184,.12);
  color:var(--text);
}

.new-tab {
  width:35px;
  height:35px;
  margin-bottom:1px;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:22px;
}

/* NAV */

.nav {
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  background:rgba(16,24,39,.82);
  border-bottom:1px solid var(--border);
}

body.light .nav {
  background:rgba(255,255,255,.82);
}

.nav-button {
  width:38px;
  height:38px;
  border-radius:10px;
  background:var(--panel2);
  color:var(--text);
  cursor:pointer;
  border:1px solid var(--border);
  font-size:17px;
}

.nav-button:disabled {
  opacity:.3;
  cursor:default;
}

.address-wrap {
  flex:1;
  position:relative;
}

.address {
  width:100%;
  height:40px;
  padding:0 65px 0 42px;
  border-radius:20px;
  border:1px solid var(--border);
  outline:none;
  background:rgba(2,6,23,.35);
  color:var(--text);
}

body.light .address {
  background:#f8fafc;
}

.address:focus {
  border-color:var(--accent);
  box-shadow:
    0 0 0 3px
    rgba(99,102,241,.12);
}

.lock {
  position:absolute;
  left:15px;
  top:11px;
  opacity:.7;
}

.go {
  position:absolute;
  right:5px;
  top:5px;
  height:30px;
  padding:0 13px;
  border-radius:15px;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  color:white;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

/* INFO */

.info {
  height:31px;
  display:flex;
  align-items:center;
  gap:19px;
  padding:0 14px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
  overflow-x:auto;
}

.info strong {
  color:var(--text);
}

.green {
  color:var(--green);
}

/* CONTENT */

.content {
  flex:1;
  min-height:0;
  position:relative;
}

.page {
  position:absolute;
  inset:0;
  display:none;
}

.page.active {
  display:block;
}

iframe {
  width:100%;
  height:100%;
  border:0;
  background:white;
}

/* HOME */

.home {
  height:100%;
  overflow:auto;
  display:flex;
  justify-content:center;
  padding:62px 20px;
}

.home-inner {
  width:min(1050px,100%);
  text-align:center;
}

.hero-icon {
  width:86px;
  height:86px;
  display:grid;
  place-items:center;
  margin:0 auto 20px;
  border-radius:26px;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  box-shadow:
    0 25px 70px
    rgba(99,102,241,.32);
  font-size:37px;
}

.hero {
  margin:0;
  font-size:clamp(44px,7vw,76px);
  font-weight:950;
  letter-spacing:-4px;
}

.hero span {
  background:
    linear-gradient(
      90deg,
      #60a5fa,
      #8b5cf6,
      #ec4899
    );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitle {
  max-width:680px;
  margin:18px auto 30px;
  color:var(--muted);
  line-height:1.6;
}

.home-search {
  width:min(800px,100%);
  display:flex;
  gap:8px;
  padding:7px;
  margin:auto;
  border-radius:18px;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:
    0 30px 90px
    rgba(0,0,0,.25);
}

.home-input {
  flex:1;
  min-width:0;
  padding:15px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
}

.home-go {
  padding:0 25px;
  border-radius:13px;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  color:white;
  font-weight:850;
  cursor:pointer;
}

.section-title {
  margin-top:38px;
  margin-bottom:14px;
  color:var(--muted);
  font-size:12px;
  font-weight:850;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.cards {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card {
  text-align:left;
  padding:18px;
  border-radius:17px;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;
  transition:
    transform .18s ease,
    border-color .18s ease;
}

.card:hover {
  transform:translateY(-3px);
  border-color:var(--accent);
}

.card-icon {
  font-size:25px;
  margin-bottom:10px;
}

.card-name {
  font-size:14px;
  font-weight:850;
}

.card-url {
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

/* GAME PANEL */

.game-panel {
  position:fixed;
  bottom:15px;
  left:15px;
  z-index:4000;
  width:285px;
  display:none;
  padding:15px;
  border-radius:17px;
  background:rgba(15,23,42,.94);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:
    0 20px 80px
    rgba(0,0,0,.45);
  backdrop-filter:blur(20px);
}

.game-panel.show {
  display:block;
}

.game-title {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:900;
  margin-bottom:12px;
}

.game-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:
    0 0 12px
    rgba(34,197,94,.7);
}

.game-row {
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:
    1px solid
    rgba(255,255,255,.06);
  color:#94a3b8;
  font-size:11px;
}

.game-row strong {
  color:white;
}

.game-close {
  float:right;
  width:24px;
  height:24px;
  border-radius:7px;
  background:rgba(255,255,255,.07);
  color:white;
  cursor:pointer;
}

/* LOADING */

.loading {
  position:absolute;
  inset:0;
  z-index:3000;
  display:none;
  place-items:center;
  background:rgba(2,6,23,.94);
  backdrop-filter:blur(15px);
}

.loading.show {
  display:grid;
}

.loading-box {
  width:min(430px,88%);
  padding:30px;
  text-align:center;
  border-radius:21px;
  background:#101827;
  border:
    1px solid
    rgba(255,255,255,.08);
  box-shadow:
    0 30px 100px
    rgba(0,0,0,.5);
}

.spinner {
  width:58px;
  height:58px;
  margin:0 auto 18px;
  border-radius:50%;
  border:
    4px solid
    rgba(255,255,255,.08);
  border-top-color:#8b5cf6;
  animation:
    spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform:rotate(360deg);
  }
}

.loading-title {
  font-size:21px;
  font-weight:900;
}

.loading-url {
  margin-top:8px;
  color:#94a3b8;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.progress {
  height:5px;
  margin-top:22px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
}

.progress-bar {
  width:35%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      #60a5fa,
      #8b5cf6,
      #ec4899
    );
  animation:
    progress 1.3s ease-in-out infinite;
}

@keyframes progress {
  from {
    transform:translateX(-140%);
  }

  to {
    transform:translateX(380%);
  }
}

/* MOBILE */

@media (max-width:750px) {

  .brand,
  .online {
    display:none;
  }

  .deactivate {
    padding:0 9px;
    font-size:9px;
  }

  .cards {
    grid-template-columns:
      repeat(2,1fr);
  }

  .home-search {
    flex-direction:column;
  }

  .home-go {
    height:50px;
  }

}

</style>

</head>

<body>

<div class="browser">

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      ⚡
    </div>

    <div class="brand">
      Fast<span>Proxy</span>
    </div>

    <div class="online">

      <span class="online-dot"></span>

      Online

    </div>

    <div class="header-space"></div>

    <button
      id="serverButton"
      class="server-button"
    >

      🌎

      <span id="serverName">
        US East
      </span>

      ▾

    </button>

    <!-- DEACTIVATION BUTTON -->

    <button
      id="deactivate"
      class="deactivate"
      title="Close current website and clear its tab history"
    >
      DEACTIVATION
    </button>

    <button
      id="theme"
      class="theme"
      title="Toggle theme"
    >
      ☀️
    </button>

  </header>


  <!-- SERVER MENU -->

  <div
    id="serverMenu"
    class="server-menu"
  >

    <div class="server-heading">
      Proxy servers
    </div>

    <div
      id="serverList"
    ></div>

  </div>


  <!-- TABS -->

  <div
    id="tabs"
    class="tabs"
  ></div>


  <!-- NAVIGATION -->

  <div class="nav">

    <button
      id="back"
      class="nav-button"
    >
      ←
    </button>

    <button
      id="forward"
      class="nav-button"
    >
      →
    </button>

    <button
      id="reload"
      class="nav-button"
    >
      ⟳
    </button>

    <button
      id="home"
      class="nav-button"
    >
      ⌂
    </button>

    <div class="address-wrap">

      <span class="lock">
        🔒
      </span>

      <input
        id="address"
        class="address"
        placeholder="Search or enter website"
        autocomplete="off"
        spellcheck="false"
      >

      <button
        id="go"
        class="go"
      >
        Go
      </button>

    </div>

  </div>


  <!-- INFO -->

  <div class="info">

    <span>
      ⚡ Speed:
      <strong id="speed">
        —
      </strong>
    </span>

    <span>
      🧠 Cache:
      <strong id="cache">
        Ready
      </strong>
    </span>

    <span>
      🎮 Game Mode:
      <strong
        id="gameStatus"
        class="green"
      >
        ON
      </strong>
    </span>

    <span>
      🌎 Server:
      <strong id="currentServer">
        US East
      </strong>
    </span>

    <span>
      ●
      <strong
        id="status"
        class="green"
      >
        Ready
      </strong>
    </span>

  </div>


  <!-- CONTENT -->

  <main
    id="content"
    class="content"
  ></main>


  <!-- LOADING SCREEN -->

  <div
    id="loading"
    class="loading"
  >

    <div class="loading-box">

      <div class="spinner"></div>

      <div class="loading-title">
        Starting Game Mode
      </div>

      <div
        id="loadingUrl"
        class="loading-url"
      >
        Preparing connection...
      </div>

      <div class="progress">

        <div
          class="progress-bar"
        ></div>

      </div>

    </div>

  </div>


  <!-- GAME PANEL -->

  <div
    id="gamePanel"
    class="game-panel"
  >

    <button
      id="gameClose"
      class="game-close"
    >
      ×
    </button>

    <div class="game-title">

      <span class="game-dot"></span>

      🎮 Game Mode

    </div>

    <div class="game-row">

      <span>
        Runtime
      </span>

      <strong id="runtimeStatus">
        Ready
      </strong>

    </div>

    <div class="game-row">

      <span>
        API requests
      </span>

      <strong id="apiCount">
        0
      </strong>

    </div>

    <div class="game-row">

      <span>
        WebSockets
      </span>

      <strong id="wsStatus">
        Ready
      </strong>

    </div>

    <div class="game-row">

      <span>
        Speed
      </span>

      <strong id="gameSpeed">
        —
      </strong>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SERVERS
========================================================= */

const SERVERS = [

  {
    name:
      "US East",

    flag:
      "🇺🇸",

    url:
      "https://idk-3-89oq.onrender.com"
  }

];


/* =========================================================
   STATE
========================================================= */

let selectedServer =
  SERVERS[0];

let tabs = [];

let activeTabId =
  null;

let nextTabId =
  1;

let apiRequests =
  0;


/* =========================================================
   ELEMENTS
========================================================= */

const tabsEl =
  document.getElementById(
    "tabs"
  );

const contentEl =
  document.getElementById(
    "content"
  );

const addressEl =
  document.getElementById(
    "address"
  );

const loadingEl =
  document.getElementById(
    "loading"
  );

const loadingUrlEl =
  document.getElementById(
    "loadingUrl"
  );

const speedEl =
  document.getElementById(
    "speed"
  );

const cacheEl =
  document.getElementById(
    "cache"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const serverNameEl =
  document.getElementById(
    "serverName"
  );

const currentServerEl =
  document.getElementById(
    "currentServer"
  );

const serverMenuEl =
  document.getElementById(
    "serverMenu"
  );

const serverListEl =
  document.getElementById(
    "serverList"
  );

const gamePanel =
  document.getElementById(
    "gamePanel"
  );

const gameStatus =
  document.getElementById(
    "gameStatus"
  );

const runtimeStatus =
  document.getElementById(
    "runtimeStatus"
  );

const apiCount =
  document.getElementById(
    "apiCount"
  );

const wsStatus =
  document.getElementById(
    "wsStatus"
  );

const gameSpeed =
  document.getElementById(
    "gameSpeed"
  );


/* =========================================================
   SERVER UI
========================================================= */

function updateServerUI() {

  serverNameEl.textContent =
    selectedServer.name;

  currentServerEl.textContent =
    selectedServer.name;

}


function renderServers() {

  serverListEl.innerHTML =
    "";

  SERVERS.forEach(
    server => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "server-option";

      button.innerHTML = `

        <span>
          ${server.flag}
        </span>

        <span class="server-option-name">
          ${server.name}
        </span>

        <span class="server-status">
          Online
        </span>

      `;

      button.onclick =
        () => {

          selectedServer =
            server;

          updateServerUI();

          serverMenuEl.classList.remove(
            "show"
          );

        };

      serverListEl.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   PROXY URL
========================================================= */

function buildProxyUrl(
  url
) {

  return (
    selectedServer.url +
    "/proxy?url=" +
    encodeURIComponent(
      url
    )
  );

}


/* =========================================================
   HOME
========================================================= */

function homeHTML() {

  return `

    <div class="home">

      <div class="home-inner">

        <div class="hero-icon">
          ⚡
        </div>

        <h1 class="hero">
          Fast<span>Proxy</span>

}


/* =========================================================
   CREATE TAB
========================================================= */

function createTab() {

  const id =
    nextTabId++;


  const page =
    document.createElement(
      "div"
    );

  page.className =
    "page";

  page.innerHTML =
    homeHTML();


  contentEl.appendChild(
    page
  );


  const tab = {

    id,

    title:
      "New Tab",

    url:
      null,

    history:
      [],

    historyIndex:
      -1,

    page,

    iframe:
      null

  };


  tabs.push(
    tab
  );

  activeTabId =
    id;


  attachHomeEvents(
    page
  );

  renderTabs();

  switchTab(
    id
  );

}


/* =========================================================
   ACTIVE TAB
========================================================= */

function getActiveTab() {

  return tabs.find(
    tab =>
      tab.id ===
      activeTabId
  );

}


/* =========================================================
   NAVIGATE
========================================================= */

function navigate(
  rawUrl
) {

  let url =
    rawUrl.trim();


  if (!url) {
    return;
  }


  if (
    !/^https?:\/\//i.test(
      url
    )
  ) {

    url =
      "https://" +
      url;

  }


  try {

    url =
      new URL(
        url
      ).href;

  } catch {

    statusEl.textContent =
      "Invalid URL";

    return;

  }


  const tab =
    getActiveTab();


  if (!tab) {
    return;
  }


  showLoading(
    url
  );


  const start =
    performance.now();


  apiRequests =
    0;

  apiCount.textContent =
    "0";


  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.src =
    buildProxyUrl(
      url
    );


  iframe.allow =
    "autoplay; fullscreen; gamepad; microphone; camera; clipboard-read; clipboard-write";


  iframe.allowFullscreen =
    true;


  iframe.addEventListener(
    "load",
    () => {

      const elapsed =
        performance.now() -
        start;


      const display =
        elapsed < 1000
          ? Math.round(
              elapsed
            ) + " ms"
          : (
              elapsed /
              1000
            ).toFixed(2) +
            " s";


      speedEl.textContent =
        display;

      gameSpeed.textContent =
        display;


      loadingEl.classList.remove(
        "show"
      );


      statusEl.textContent =
        "Loaded";


      cacheEl.textContent =
        "Active";


      runtimeStatus.textContent =
        "Running";


      gamePanel.classList.add(
        "show"
      );

    }
  );


  iframe.addEventListener(
    "error",
    () => {

      loadingEl.classList.remove(
        "show"
      );

      statusEl.textContent =
        "Error";

    }
  );


  tab.page.innerHTML =
    "";

  tab.page.appendChild(
    iframe
  );


  tab.iframe =
    iframe;

  tab.url =
    url;

  tab.title =
    getDomain(
      url
    );


  /*
   * Add to history.
   */
  tab.history =
    tab.history.slice(
      0,
      tab.historyIndex + 1
    );


  tab.history.push(
    url
  );


  tab.historyIndex =
    tab.history.length - 1;


  renderTabs();

  updateAddress();

  updateNavigation();

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(
  url
) {

  loadingUrlEl.textContent =
    url;

  loadingEl.classList.add(
    "show"
  );

  statusEl.textContent =
    "Loading";

  speedEl.textContent =
    "Loading...";

}


/* =========================================================
   TABS
========================================================= */

function renderTabs() {

  tabsEl.innerHTML =
    "";


  tabs.forEach(
    tab => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "tab" +
        (
          tab.id ===
          activeTabId
            ? " active"
            : ""
        );


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "tab-title";

      title.textContent =
        tab.title;


      const close =
        document.createElement(
          "button"
        );

      close.className =
        "tab-close";

      close.textContent =
        "×";


      close.onclick =
        event => {

          event.stopPropagation();

          closeTab(
            tab.id
          );

        };


      item.appendChild(
        title
      );

      item.appendChild(
        close
      );


      item.onclick =
        () =>
          switchTab(
            tab.id
          );


      tabsEl.appendChild(
        item
      );

    }
  );


  const plus =
    document.createElement(
      "button"
    );

  plus.className =
    "new-tab";

  plus.textContent =
    "+";


  plus.onclick =
    () =>
      createTab();


  tabsEl.appendChild(
    plus
  );

}


/* =========================================================
   SWITCH TAB
========================================================= */

function switchTab(
  id
) {

  activeTabId =
    id;


  tabs.forEach(
    tab => {

      tab.page.classList.toggle(
        "active",
        tab.id === id
      );

    }
  );


  updateAddress();

  updateNavigation();

  renderTabs();


  const tab =
    getActiveTab();


  if (
    tab &&
    tab.url
  ) {

    statusEl.textContent =
      "Ready";

  } else {

    statusEl.textContent =
      "Home";

  }

}


/* =========================================================
   CLOSE TAB
========================================================= */

function closeTab(
  id
) {

  const index =
    tabs.findIndex(
      tab =>
        tab.id === id
    );


  if (index === -1) {
    return;
  }


  /*
   * Destroy the tab.
   */
  tabs[index].page.remove();


  tabs.splice(
    index,
    1
  );


  if (!tabs.length) {

    createTab();

    return;

  }


  if (
    activeTabId === id
  ) {

    const newIndex =
      Math.max(
        0,
        index - 1
      );


    activeTabId =
      tabs[
        newIndex
      ].id;

  }


  renderTabs();

  switchTab(
    activeTabId
  );

}


/* =========================================================
   DEACTIVATION
========================================================= */

function deactivateCurrentTab() {

  const tab =
    getActiveTab();


  if (!tab) {
    return;
  }


  /*
   * Remove the current website
   * from the page.
   */
  if (tab.page) {
    tab.page.remove();
  }


  /*
   * Destroy all tab data.
   */
  tab.url =
    null;

  tab.history =
    [];

  tab.historyIndex =
    -1;

  tab.iframe =
    null;


  /*
   * Remove tab completely.
   */
  const index =
    tabs.findIndex(
      t =>
        t.id ===
        tab.id
    );


  if (index !== -1) {

    tabs.splice(
      index,
      1
    );

  }


  activeTabId =
    null;


  /*
   * Reset UI.
   */
  loadingEl.classList.remove(
    "show"
  );

  speedEl.textContent =
    "—";

  cacheEl.textContent =
    "Cleared";

  statusEl.textContent =
    "Deactivated";

  gameStatus.textContent =
    "OFF";

  runtimeStatus.textContent =
    "Stopped";

  apiRequests =
    0;

  apiCount.textContent =
    "0";

  wsStatus.textContent =
    "Stopped";

  gameSpeed.textContent =
    "—";

  gamePanel.classList.remove(
    "show"
  );


  /*
   * Open a fresh New Tab.
   */
  createTab();

}


/* =========================================================
   DEACTIVATION BUTTON
========================================================= */

document.getElementById(
  "deactivate"
).onclick =
  () => {

    deactivateCurrentTab();

  };


/* =========================================================
   ADDRESS
========================================================= */

function updateAddress() {

  const tab =
    getActiveTab();


  addressEl.value =
    tab && tab.url
      ? tab.url
      : "";

}


/* =========================================================
   NAVIGATION
========================================================= */

function updateNavigation() {

  const tab =
    getActiveTab();


  if (!tab) {
    return;
  }


  document.getElementById(
    "back"
  ).disabled =
    tab.historyIndex <= 0;


  document.getElementById(
    "forward"
  ).disabled =
    tab.historyIndex >=
    tab.history.length - 1;

}


document.getElementById(
  "back"
).onclick =
  () => {

    const tab =
      getActiveTab();


    if (
      !tab ||
      tab.historyIndex <= 0
    ) {
      return;
    }


    tab.historyIndex--;


    const url =
      tab.history[
        tab.historyIndex
      ];


    loadHistory(
      tab,
      url
    );

  };


document.getElementById(
  "forward"
).onclick =
  () => {

    const tab =
      getActiveTab();


    if (
      !tab ||
      tab.historyIndex >=
        tab.history.length - 1
    ) {
      return;
    }


    tab.historyIndex++;


    const url =
      tab.history[
        tab.historyIndex
      ];


    loadHistory(
      tab,
      url
    );

  };


function loadHistory(
  tab,
  url
) {

  showLoading(
    url
  );


  const start =
    performance.now();


  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.src =
    buildProxyUrl(
      url
    );


  iframe.allow =
    "autoplay; fullscreen; gamepad; microphone; camera; clipboard-read; clipboard-write";


  iframe.allowFullscreen =
    true;


  iframe.addEventListener(
    "load",
    () => {

      const elapsed =
        performance.now() -
        start;


      speedEl.textContent =
        elapsed < 1000
          ? Math.round(
              elapsed
            ) + " ms"
          : (
              elapsed /
              1000
            ).toFixed(2) +
            " s";


      loadingEl.classList.remove(
        "show"
      );


      statusEl.textContent =
        "Loaded";

    }
  );


  tab.page.innerHTML =
    "";

  tab.page.appendChild(
    iframe
  );


  tab.iframe =
    iframe;

  tab.url =
    url;

  tab.title =
    getDomain(
      url
    );


  updateAddress();

  updateNavigation();

  renderTabs();

}


/* =========================================================
   RELOAD
========================================================= */

document.getElementById(
  "reload"
).onclick =
  () => {

    const tab =
      getActiveTab();


    if (
      tab &&
      tab.url
    ) {

      loadHistory(
        tab,
        tab.url
      );

    }

  };


/* =========================================================
   HOME
========================================================= */

document.getElementById(
  "home"
).onclick =
  () => {

    const tab =
      getActiveTab();


    if (!tab) {
      return;
    }


    tab.url =
      null;

    tab.title =
      "New Tab";

    tab.history =
      [];

    tab.historyIndex =
      -1;

    tab.page.innerHTML =
      homeHTML();

    tab.iframe =
      null;


    attachHomeEvents(
      tab.page
    );


    updateAddress();

    updateNavigation();

    renderTabs();


    speedEl.textContent =
      "—";

    cacheEl.textContent =
      "Ready";

    statusEl.textContent =
      "Home";

    gameStatus.textContent =
      "ON";

    gamePanel.classList.remove(
      "show"
    );

  };


/* =========================================================
   ADDRESS BAR
========================================================= */

document.getElementById(
  "go"
).onclick =
  () => {

    navigate(
      addressEl.value
    );

  };


addressEl.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      navigate(
        addressEl.value
      );

    }

  }
);


/* =========================================================
   HOME EVENTS
========================================================= */

function attachHomeEvents(
  page
) {

  const input =
    page.querySelector(
      ".home-input"
    );

  const button =
    page.querySelector(
      ".home-go"
    );


  if (
    input &&
    button
  ) {

    button.onclick =
      () =>
        navigate(
          input.value
        );


    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          navigate(
            input.value
          );

        }

      }
    );

  }


  page
    .querySelectorAll(
      ".card"
    )
    .forEach(
      card => {

        card.onclick =
          () =>
            navigate(
              card.dataset.url
            );

      }
    );

}


/* =========================================================
   GAME EVENTS
========================================================= */

window.addEventListener(
  "message",
  event => {

    const data =
      event.data;


    if (
      !data ||
      data.source !==
        "fastproxy"
    ) {

      return;

    }


    if (
      data.type ===
      "runtime-ready"
    ) {

      runtimeStatus.textContent =
        "Ready";

      gameStatus.textContent =
        "ON";

    }


    if (
      data.type === "fetch" ||
      data.type === "xhr" ||
      data.type === "request" ||
      data.type === "beacon"
    ) {

      apiRequests++;

      apiCount.textContent =
        apiRequests;

    }


    if (
      data.type ===
      "websocket"
    ) {

      wsStatus.textContent =
        "Connecting";


      setTimeout(
        () => {

          wsStatus.textContent =
            "Active";

        },
        600
      );

    }

  }
);


/* =========================================================
   SERVER MENU
========================================================= */

document.getElementById(
  "serverButton"
).onclick =
  event => {

    event.stopPropagation();

    serverMenuEl.classList.toggle(
      "show"
    );

  };


document.addEventListener(
  "click",
  event => {

    if (
      !serverMenuEl.contains(
        event.target
      ) &&
      !document.getElementById(
        "serverButton"
      ).contains(
        event.target
      )
    ) {

      serverMenuEl.classList.remove(
        "show"
      );

    }

  }
);


/* =========================================================
   THEME
========================================================= */

const themeButton =
  document.getElementById(
    "theme"
  );


const savedTheme =
  localStorage.getItem(
    "fastproxy-theme"
  );


if (
  savedTheme ===
  "light"
) {

  document.body.classList.add(
    "light"
  );

  themeButton.textContent =
    "🌙";

}


themeButton.onclick =
  () => {

    const light =
      document.body.classList.toggle(
        "light"
      );


    localStorage.setItem(
      "fastproxy-theme",
      light
        ? "light"
        : "dark"
    );


    themeButton.textContent =
      light
        ? "🌙"
        : "☀️";

  };


/* =========================================================
   GAME PANEL CLOSE
========================================================= */

document.getElementById(
  "gameClose"
).onclick =
  () => {

    gamePanel.classList.remove(
      "show"
    );

  };


/* =========================================================
   DOMAIN
========================================================= */

function getDomain(
  url
) {

  try {

    return new URL(
      url
    ).hostname.replace(
      /^www\./,
      ""
    );

  } catch {

    return "New Tab";

  }

}


/* =========================================================
   START
========================================================= */

updateServerUI();

renderServers();

createTab();

</script>
